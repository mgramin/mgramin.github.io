[params]
  description = "My name is Maksim Gramin. I'm a software developer passionate about Databases and SQL."
  author = "Maksim Gramin"
  defaultTheme = "light"
  DateFormat = "January 2, 2006"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = true
  mainSections = ["posts"]

